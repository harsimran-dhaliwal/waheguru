<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waheguru – Download the App</title>
<script>
  // Universal app link: sends each phone to the right store.
  var IOS_URL = "https://apps.apple.com/app/id6802036172";
  var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.anhadSimran.anhad_simran";

  var ua = navigator.userAgent || "";
  var isAndroid = /android/i.test(ua);
  // iPadOS 13+ reports itself as "Macintosh", so also check for touch support.
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  if (isIOS) { window.location.replace(IOS_URL); }
  else if (isAndroid) { window.location.replace(ANDROID_URL); }
</script>
<style>
  :root { --bg:#fffaf2; --ink:#1f2a44; --accent:#e07b00; --muted:#5b6478; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; box-sizing:border-box; }
  .card { max-width:420px; width:100%; text-align:center; }
  h1 { font-size:2rem; margin:0 0 .25rem; }
  p { color:var(--muted); margin:0 0 1.75rem; }
  a.btn { display:block; padding:14px 18px; margin:0 0 12px; border-radius:12px; text-decoration:none;
          font-weight:600; font-size:1.05rem; color:#fff; background:var(--ink); }
  a.btn.play { background:var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>Waheguru</h1>
    <p>Choose your store to download the app.</p>
    <a class="btn" href="https://apps.apple.com/app/id6802036172">Download on the App Store</a>
    <a class="btn play" href="https://play.google.com/store/apps/details?id=com.anhadSimran.anhad_simran">Get it on Google Play</a>
  </div>
</body>
</html>
